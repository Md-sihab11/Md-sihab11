<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1a"/>
      <stop offset="50%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#16082b"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- Styling with System Fallback Fonts -->
    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 58px;
        fill: white;
      }

      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 28px;
        fill: #a5caff;
      }

      .tagline {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: #e2e8f0;
      }

      .badge {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 24px;
        fill: white;
      }

      .signature {
        font-family: 'Caveat', 'Brush Script MT', cursive;
        font-size: 64px;
        fill: #60a5fa;
      }

      .contact {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: #cbd5e1;
      }

      .icon {
        font-family: monospace;
        font-weight: 800;
        font-size: 16px;
      }

      .float-icon {
        font-family: system-ui, monospace, sans-serif;
        font-weight: 800;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- SCRIPT FOR REAL-TIME CLOCK ACCURACY -->
  <script type="text/ecmascript">
    <![CDATA[
      function updateLiveTime() {
        const now = new Date();
        
        // Analog Clock Calculations
        const ms = now.getMilliseconds();
        const sec = now.getSeconds() + ms / 1000;
        const min = now.getMinutes() + sec / 60;
        const hr = (now.getHours() % 12) + min / 60;

        const secHand = document.getElementById('sec-hand');
        const minHand = document.getElementById('min-hand');
        const hrHand = document.getElementById('hr-hand');

        if (secHand) secHand.setAttribute('transform', 'rotate(' + (sec * 6) + ')');
        if (minHand) minHand.setAttribute('transform', 'rotate(' + (min * 6) + ')');
        if (hrHand) hrHand.setAttribute('transform', 'rotate(' + (hr * 30) + ')');

        requestAnimationFrame(updateLiveTime);
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateLiveTime);
      } else {
        updateLiveTime();
      }
    ]]>
  </script>

  <!-- BACKGROUND -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <circle cx="480" cy="180" r="180" fill="#0284c7" opacity=".25" filter="url(#bigGlow)"/>
  <circle cx="1000" cy="150" r="230" fill="#4c1d95" opacity=".22" filter="url(#bigGlow)"/>

