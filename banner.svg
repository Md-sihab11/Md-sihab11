<!-- ================= ANIMATED DOTTED CIRCUIT NETWORK ================= -->

<!-- Top Center Circuit -->
<path d="M 350 20 L 350 70 L 410 120 L 500 120"
      fill="none"
      stroke="#38bdf8"
      stroke-width="1.5"
      stroke-dasharray="2 8"
      stroke-linecap="round"
      opacity="0.65">
  <animate attributeName="stroke-dashoffset"
           from="0" to="-40"
           dur="2s"
           repeatCount="indefinite" />
</path>

<circle cx="350" cy="70" r="3" fill="#38bdf8" filter="url(#glow)">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="1.8s"
           repeatCount="indefinite" />
  <animate attributeName="r"
           values="2;4;2"
           dur="1.8s"
           repeatCount="indefinite" />
</circle>

<circle cx="500" cy="120" r="3" fill="#38bdf8" filter="url(#glow)">
  <animate attributeName="opacity"
           values="1;0.2;1"
           dur="2.5s"
           repeatCount="indefinite" />
</circle>


